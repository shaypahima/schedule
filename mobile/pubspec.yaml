name: velofit
description: Velofit — Hebrew RTL mobile client for the coach booking platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (ADR 0001)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.7.0

  # Auth
  supabase_flutter: ^2.8.0

  # Fonts
  google_fonts: ^6.2.1

  # Motion layer (ADR-0008) — declarative, RTL-safe, tiny.
  flutter_animate: ^4.5.0

  # i18n
  intl: ^0.20.2

  # Deep links (WhatsApp / tel:)
  url_launcher: ^6.3.1

  # Vector assets (brand logos, e.g. Google "G")
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Riverpod codegen
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5

  # Test helpers
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/google_g.svg
