org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Bypass the Kotlin daemon — runs the compiler in-process. Slower per
# build but sidesteps the "Daemon compilation failed" error you get on
# Windows with Kotlin Build Tools API + AGP.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=true

# Disable Kotlin incremental compilation — the "could not close
# incremental caches" error in shared_preferences_android is a known
# Windows file-lock issue. Slows rebuilds but unblocks fresh builds.
kotlin.incremental=false
